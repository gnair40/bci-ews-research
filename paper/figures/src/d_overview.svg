<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The research in one picture: a problem, one monitor, two validations and one verdict rule" width="640" height="470" viewBox="0 0 640 470"><rect width="640" height="470" fill="#FFFFFF"/><rect x="20" y="10" width="600" height="50" rx="5" fill="#F7E6EB" stroke="#8C1D3B" stroke-width="1.6"/><text x="320.0" y="25.3" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#101A24" text-anchor="middle">Problem</text><text x="320.0" y="39.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">A decoder loses accuracy as the recording drifts. No test shows whether a warning is early</text><text x="320.0" y="52.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">enough or rarely wrong.</text><rect x="20" y="82" width="600" height="50" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="320.0" y="97.3" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#101A24" text-anchor="middle">Approach</text><text x="320.0" y="111.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">One monitor (decoder-guard) reading only the recorded signal, scored against failure times fixed</text><text x="320.0" y="124.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">before any detector existed.</text><polyline points="320.0,60.0 320.0,74.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M320.0 82.0 L315.5 74.0 L324.5 74.0 Z" fill="#33414D"/><rect x="20" y="152" width="292" height="232" rx="7" fill="none" stroke="#1B5A8E" stroke-width="1.4" stroke-dasharray="3 4"/><text x="30.0" y="168.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1B5A8E" text-anchor="start">Computational validation: complete</text><rect x="328" y="152" width="292" height="232" rx="7" fill="none" stroke="#B24E0A" stroke-width="1.4" stroke-dasharray="3 4"/><text x="338.0" y="168.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#B24E0A" text-anchor="start">Physical validation: preregistered, not built</text><rect x="34" y="176" width="264" height="40" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="166.0" y="193.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Archived recordings, arrays T11 and T5</text><text x="166.0" y="208.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">public and de-identified</text><rect x="34" y="228" width="264" height="40" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="166.0" y="245.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">1,850 planted faults</text><text x="166.0" y="260.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">start times sealed with SHA-256</text><rect x="34" y="280" width="264" height="40" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="166.0" y="297.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Frozen decoder grades the outcome</text><text x="166.0" y="312.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">five gates, test data read once</text><rect x="34" y="332" width="264" height="40" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="166.0" y="349.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Measured: lead time and false alarms</text><text x="166.0" y="364.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">sections 6 and 7</text><rect x="342" y="176" width="264" height="40" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="474.0" y="193.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Optical test bench</text><text x="474.0" y="208.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">screen, camera, sealed dark box</text><rect x="342" y="228" width="264" height="40" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="474.0" y="245.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Five acceptance gates, G-a to G-e</text><text x="474.0" y="260.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">must pass before any result is read</text><rect x="342" y="280" width="264" height="40" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="474.0" y="297.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">337 sessions in seven experiments</text><text x="474.0" y="312.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">onsets sealed before each recording</text><rect x="342" y="332" width="264" height="40" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6" stroke-dasharray="6 4"/><text x="474.0" y="349.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">To be measured</text><text x="474.0" y="364.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">red placeholders in sections 6 to 8</text><polyline points="166.0,216.0 166.0,220.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M166.0 228.0 L161.5 220.0 L170.5 220.0 Z" fill="#33414D"/><polyline points="166.0,268.0 166.0,272.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M166.0 280.0 L161.5 272.0 L170.5 272.0 Z" fill="#33414D"/><polyline points="166.0,320.0 166.0,324.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M166.0 332.0 L161.5 324.0 L170.5 324.0 Z" fill="#33414D"/><polyline points="474.0,216.0 474.0,220.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M474.0 228.0 L469.5 220.0 L478.5 220.0 Z" fill="#33414D"/><polyline points="474.0,268.0 474.0,272.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M474.0 280.0 L469.5 272.0 L478.5 272.0 Z" fill="#33414D"/><polyline points="474.0,320.0 474.0,324.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M474.0 332.0 L469.5 324.0 L478.5 324.0 Z" fill="#33414D"/><polyline points="166.0,132.0 166.0,144.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M166.0 152.0 L161.5 144.0 L170.5 144.0 Z" fill="#33414D"/><polyline points="474.0,132.0 474.0,144.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M474.0 152.0 L469.5 144.0 L478.5 144.0 Z" fill="#33414D"/><rect x="120" y="410" width="400" height="50" rx="5" fill="#E7F2E9" stroke="#2E6B3A" stroke-width="1.6"/><text x="320.0" y="425.3" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#101A24" text-anchor="middle">Comparison and verdict</text><text x="320.0" y="439.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">Same monitor, same 30 s window, same 0.1 per hour budget. The</text><text x="320.0" y="452.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">judging rule was frozen on 24 September 2026.</text><polyline points="166.0,384.0 166.0,397.0 240.0,397.0 240.0,402.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M240.0 410.0 L235.5 402.0 L244.5 402.0 Z" fill="#33414D"/><polyline points="474.0,384.0 474.0,397.0 400.0,397.0 400.0,402.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M400.0 410.0 L395.5 402.0 L404.5 402.0 Z" fill="#33414D"/></svg>