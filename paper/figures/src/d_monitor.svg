<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The monitor: four named components, the largest reported as the risk" width="640" height="176" viewBox="0 0 640 176"><rect width="640" height="176" fill="#FFFFFF"/><rect x="16" y="44" width="116" height="88" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="74.0" y="63.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="700" fill="#101A24" text-anchor="middle">384 channels</text><text x="74.0" y="77.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">log activity in</text><text x="74.0" y="92.3" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">each 30 s</text><text x="74.0" y="106.7" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">window, a new</text><text x="74.0" y="121.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">window every 5 s</text><rect x="160" y="14" width="150" height="64" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="235.0" y="35.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">level</text><text x="235.0" y="50.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">total activity has</text><text x="235.0" y="65.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">moved</text><rect x="322" y="14" width="150" height="64" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="397.0" y="35.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">silence</text><text x="397.0" y="50.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">channels have gone</text><text x="397.0" y="65.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">quiet</text><rect x="160" y="98" width="150" height="64" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="235.0" y="113.4" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#101A24" text-anchor="middle">dispersion</text><text x="235.0" y="127.2" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">channels drift apart</text><text x="235.0" y="141.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">in gain, total</text><text x="235.0" y="154.8" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">unchanged</text><rect x="322" y="98" width="150" height="64" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="397.0" y="119.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">profile</text><text x="397.0" y="134.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">the shape across</text><text x="397.0" y="149.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">channels has changed</text><rect x="500" y="44" width="124" height="88" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="562.0" y="59.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.0" font-weight="700" fill="#101A24" text-anchor="middle">Risk score</text><text x="562.0" y="72.2" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.0" font-weight="400" fill="#33414D" text-anchor="middle">the largest</text><text x="562.0" y="85.4" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.0" font-weight="400" fill="#33414D" text-anchor="middle">component, with its</text><text x="562.0" y="98.6" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.0" font-weight="400" fill="#33414D" text-anchor="middle">name; WARN when it</text><text x="562.0" y="111.8" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.0" font-weight="400" fill="#33414D" text-anchor="middle">stays above</text><text x="562.0" y="125.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.0" font-weight="400" fill="#33414D" text-anchor="middle">threshold</text><polyline points="132.0,88.0 152.0,88.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M160.0 88.0 L152.0 92.5 L152.0 83.5 Z" fill="#33414D"/><polyline points="472.0,88.0 492.0,88.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M500.0 88.0 L492.0 92.5 L492.0 83.5 Z" fill="#33414D"/></svg>