<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The computational workflow, script by script" width="640" height="300" viewBox="0 0 640 300"><rect width="640" height="300" fill="#FFFFFF"/><rect x="20" y="16" width="140" height="78" rx="5" fill="#F1F4F6" stroke="#55626E" stroke-width="1.6"/><text x="90.0" y="31.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#101A24" text-anchor="middle">01 to 03</text><text x="90.0" y="45.3" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">download with</text><text x="90.0" y="59.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">checksums, inspect,</text><text x="90.0" y="72.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">load the archived</text><text x="90.0" y="86.7" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">recordings</text><rect x="173" y="16" width="140" height="78" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="243.0" y="37.7" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="700" fill="#101A24" text-anchor="middle">17 fault injector</text><text x="243.0" y="52.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">plan 1,850 episodes,</text><text x="243.0" y="66.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">seal the onsets,</text><text x="243.0" y="80.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">verify, apply</text><rect x="326" y="16" width="140" height="78" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="396.0" y="37.7" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="700" fill="#101A24" text-anchor="middle">18 reference decoder</text><text x="396.0" y="52.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">ridge regression,</text><text x="396.0" y="66.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">fitted once, then</text><text x="396.0" y="80.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">frozen</text><rect x="479" y="16" width="140" height="78" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="549.0" y="37.7" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="700" fill="#101A24" text-anchor="middle">19 baselines, 22</text><text x="549.0" y="52.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="700" fill="#101A24" text-anchor="middle">decoder-guard</text><text x="549.0" y="66.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">detectors fitted on</text><text x="549.0" y="80.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">healthy windows only</text><rect x="479" y="196" width="140" height="78" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="549.0" y="218.4" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#101A24" text-anchor="middle">20 evaluation harness</text><text x="549.0" y="232.2" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">fit, validation and</text><text x="549.0" y="246.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">test splits; one risk</text><text x="549.0" y="259.8" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#33414D" text-anchor="middle">score per window</text><rect x="326" y="196" width="140" height="78" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="396.0" y="217.7" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="700" fill="#101A24" text-anchor="middle">21 score report</text><text x="396.0" y="232.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">one threshold chosen</text><text x="396.0" y="246.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">on validation; five</text><text x="396.0" y="260.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">gates</text><rect x="173" y="196" width="140" height="78" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="243.0" y="217.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">24 benchmark matrix</text><text x="243.0" y="232.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">all 48</text><text x="243.0" y="247.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">configurations,</text><text x="243.0" y="262.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">every one reported</text><rect x="20" y="196" width="140" height="78" rx="5" fill="#E7F2E9" stroke="#2E6B3A" stroke-width="1.6"/><text x="90.0" y="217.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">31 verify claims</text><text x="90.0" y="232.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">102 headline</text><text x="90.0" y="247.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">numbers recomputed</text><text x="90.0" y="262.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">from the data files</text><polyline points="160.0,55.0 165.0,55.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M173.0 55.0 L165.0 59.5 L165.0 50.5 Z" fill="#33414D"/><polyline points="313.0,55.0 318.0,55.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M326.0 55.0 L318.0 59.5 L318.0 50.5 Z" fill="#33414D"/><polyline points="466.0,55.0 471.0,55.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M479.0 55.0 L471.0 59.5 L471.0 50.5 Z" fill="#33414D"/><polyline points="549.0,94.0 549.0,188.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M549.0 196.0 L544.5 188.0 L553.5 188.0 Z" fill="#33414D"/><polyline points="479.0,235.0 474.0,235.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M466.0 235.0 L474.0 230.5 L474.0 239.5 Z" fill="#33414D"/><polyline points="326.0,235.0 321.0,235.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M313.0 235.0 L321.0 230.5 L321.0 239.5 Z" fill="#33414D"/><polyline points="173.0,235.0 168.0,235.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M160.0 235.0 L168.0 230.5 L168.0 239.5 Z" fill="#33414D"/><text x="320.0" y="132.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#33414D" text-anchor="middle" font-style="italic">The harness (20) was committed before the monitor (22) was written,</text><text x="320.0" y="150.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#33414D" text-anchor="middle" font-style="italic">and the onsets (17) before any detector existed.</text></svg>