<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="From each measured quantity to the verdict: the statistic, its uncertainty, and the decision fixed in advance" width="640" height="540" viewBox="0 0 640 540"><rect width="640" height="540" fill="#FFFFFF"/><text x="91.0" y="18.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Quantity</text><text x="251.0" y="18.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Statistic</text><text x="406.0" y="18.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Uncertainty</text><text x="556.0" y="18.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Decision fixed in advance</text><rect x="16" y="30" width="150" height="70" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="91.0" y="62.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">False-alarm rate</text><text x="91.0" y="77.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">(DV2)</text><rect x="176" y="30" width="150" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="251.0" y="54.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">k warnings in H</text><text x="251.0" y="69.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">held-out fault-free</text><text x="251.0" y="84.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">hours: k / H</text><rect x="336" y="30" width="140" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="406.0" y="47.7" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">exact Poisson 95%</text><text x="406.0" y="62.1" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">interval; k = 0</text><text x="406.0" y="76.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">gives an upper bound</text><text x="406.0" y="90.9" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.0" font-weight="400" fill="#33414D" text-anchor="middle">of about 3 / H</text><rect x="486" y="30" width="140" height="70" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="556.0" y="54.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">upper bound above</text><text x="556.0" y="69.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">0.1 per hour: over</text><text x="556.0" y="84.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">budget</text><polyline points="166.0,65.0 168.0,65.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M176.0 65.0 L168.0 69.5 L168.0 60.5 Z" fill="#33414D"/><polyline points="326.0,65.0 328.0,65.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M336.0 65.0 L328.0 69.5 L328.0 60.5 Z" fill="#33414D"/><polyline points="476.0,65.0 478.0,65.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M486.0 65.0 L478.0 69.5 L478.0 60.5 Z" fill="#33414D"/><rect x="16" y="112" width="150" height="70" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="91.0" y="151.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Silence gate (DV4)</text><rect x="176" y="112" width="150" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="251.0" y="136.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">Kendall tau of risk</text><text x="251.0" y="151.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">against time, per</text><text x="251.0" y="166.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">fault-free session</text><rect x="336" y="112" width="140" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="406.0" y="129.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">share of sessions</text><text x="406.0" y="144.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">with p below 0.05;</text><text x="406.0" y="159.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">raw and after</text><text x="406.0" y="174.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">removing a line</text><rect x="486" y="112" width="140" height="70" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="556.0" y="136.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">more than 10%</text><text x="556.0" y="151.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">trending: gate</text><text x="556.0" y="166.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">fails</text><polyline points="166.0,147.0 168.0,147.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M176.0 147.0 L168.0 151.5 L168.0 142.5 Z" fill="#33414D"/><polyline points="326.0,147.0 328.0,147.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M336.0 147.0 L328.0 151.5 L328.0 142.5 Z" fill="#33414D"/><polyline points="476.0,147.0 478.0,147.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M486.0 147.0 L478.0 151.5 L478.0 142.5 Z" fill="#33414D"/><rect x="16" y="194" width="150" height="70" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="91.0" y="233.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Lead time (DV1)</text><rect x="176" y="194" width="150" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="251.0" y="211.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">failure time minus</text><text x="251.0" y="226.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">warning time, per</text><text x="251.0" y="241.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">session; then the</text><text x="251.0" y="256.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">median</text><rect x="336" y="194" width="140" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="406.0" y="211.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">bootstrap 95%</text><text x="406.0" y="226.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">interval, 5,000</text><text x="406.0" y="241.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">resamples, only if</text><text x="406.0" y="256.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">3 or more</text><rect x="486" y="194" width="140" height="70" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="556.0" y="226.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">median at or below</text><text x="556.0" y="241.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">0 s: warns too late</text><polyline points="166.0,229.0 168.0,229.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M176.0 229.0 L168.0 233.5 L168.0 224.5 Z" fill="#33414D"/><polyline points="326.0,229.0 328.0,229.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M336.0 229.0 L328.0 233.5 L328.0 224.5 Z" fill="#33414D"/><polyline points="476.0,229.0 478.0,229.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M486.0 229.0 L478.0 233.5 L478.0 224.5 Z" fill="#33414D"/><rect x="16" y="276" width="150" height="70" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="91.0" y="315.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Detection rate (DV3)</text><rect x="176" y="276" width="150" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="251.0" y="300.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">sessions warned</text><text x="251.0" y="315.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">after onset /</text><text x="251.0" y="330.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">degraded sessions</text><rect x="336" y="276" width="140" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="406.0" y="293.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">Wilson 95%</text><text x="406.0" y="308.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">interval; by fault</text><text x="406.0" y="323.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">type and by</text><text x="406.0" y="338.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">severity</text><rect x="486" y="276" width="140" height="70" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="556.0" y="293.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">severity 1.0 must</text><text x="556.0" y="308.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">exceed 0.25</text><text x="556.0" y="323.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">(manipulation</text><text x="556.0" y="338.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">check)</text><polyline points="166.0,311.0 168.0,311.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M176.0 311.0 L168.0 315.5 L168.0 306.5 Z" fill="#33414D"/><polyline points="326.0,311.0 328.0,311.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M336.0 311.0 L328.0 315.5 L328.0 306.5 Z" fill="#33414D"/><polyline points="476.0,311.0 478.0,311.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M486.0 311.0 L478.0 315.5 L478.0 306.5 Z" fill="#33414D"/><rect x="16" y="358" width="150" height="70" rx="5" fill="#FFFFFF" stroke="#101A24" stroke-width="1.6"/><text x="91.0" y="397.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Correlation (DV5)</text><rect x="176" y="358" width="150" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="251.0" y="382.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">Spearman: raw, with</text><text x="251.0" y="397.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">time removed, and on</text><text x="251.0" y="412.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">first differences</text><rect x="336" y="358" width="140" height="70" rx="5" fill="#E4EDF6" stroke="#1B5A8E" stroke-width="1.6"/><text x="406.0" y="390.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">three values with</text><text x="406.0" y="405.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">their p values</text><rect x="486" y="358" width="140" height="70" rx="5" fill="#FDF3E9" stroke="#B24E0A" stroke-width="1.6"/><text x="556.0" y="390.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">any magnitude at or</text><text x="556.0" y="405.0" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">above 0.70: strong</text><polyline points="166.0,393.0 168.0,393.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M176.0 393.0 L168.0 397.5 L168.0 388.5 Z" fill="#33414D"/><polyline points="326.0,393.0 328.0,393.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M336.0 393.0 L328.0 397.5 L328.0 388.5 Z" fill="#33414D"/><polyline points="476.0,393.0 478.0,393.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M486.0 393.0 L478.0 397.5 L478.0 388.5 Z" fill="#33414D"/><polyline points="556.0,428.0 556.0,438.0" fill="none" stroke="#33414D" stroke-width="1.8" stroke-linejoin="round"/><path d="M556.0 446.0 L551.5 438.0 L560.5 438.0 Z" fill="#33414D"/><rect x="60" y="446" width="566" height="84" rx="5" fill="#E7F2E9" stroke="#2E6B3A" stroke-width="1.6"/><text x="343.0" y="462.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#101A24" text-anchor="middle">Verdict rule (preregistration, section 1)</text><text x="343.0" y="477.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">Unusable: median lead time at or below 0, or the false-alarm upper bound above</text><text x="343.0" y="492.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">budget.</text><text x="343.0" y="507.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">Supported: strong and unusable. Falsified: strong and usable on both counts.</text><text x="343.0" y="522.5" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33414D" text-anchor="middle">Inconclusive: no correlation reaches 0.70.</text></svg>