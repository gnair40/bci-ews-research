<svg xmlns="http://www.w3.org/2000/svg" aria-label="Realistic board view. A Raspberry Pi 4 on the left with its 40-pin header along the top edge. Six coloured jumper wires run to a blue ULN2003 driver board: red from pin 2 to plus, black from pin 9 to minus, and orange, yellow, green and blue from pins 11, 13, 15 and 16 to IN1 to IN4. The red and blue wires leave from the lower row of the header and dip below it. The driver board's white socket connects to a 28BYJ-48 stepper motor." width="1664" height="450" viewBox="0 70 1664 450">
