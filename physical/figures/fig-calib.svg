<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Times New Roman, Liberation Serif, serif" font-size="13"><rect width="760" height="400" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AB"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D1453B"/></marker></defs><text x="24" y="30" font-size="16" font-weight="700" fill="#1A1A1A">Calibration changes one parameter at a time until the margin is in tolerance</text><text x="24" y="52" font-size="12" fill="#5A646D">Bench check B-7, which is also experiment P-1</text><path d="M226 118H290" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M462 118H526" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M376 174V233" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M278 262H128V147" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><rect x="30.0" y="89.0" width="196" height="58" rx="8" fill="#E9F2FC" stroke="#2E7BD4" stroke-width="1.5"/><text x="128" y="112" text-anchor="middle" font-weight="700" fill="#1A1A1A">Record calibration</text><text x="128" y="132" text-anchor="middle" font-size="12" fill="#5A646D">3000 frames, --calibration</text><polygon points="290,118 376,62 462,118 376,174" fill="#FDF4E4" stroke="#E0A030" stroke-width="2"/><text x="376" y="110" text-anchor="middle" font-weight="700" fill="#1A1A1A">Margin within</text><text x="376" y="130" text-anchor="middle" font-size="12" fill="#5A646D">36.1 deg plus or minus 6?</text><rect x="526.0" y="89.0" width="196" height="58" rx="8" fill="#EAF6EE" stroke="#2E9E54" stroke-width="1.5"/><text x="624" y="112" text-anchor="middle" font-weight="700" fill="#1A1A1A">Record the depth</text><text x="624" y="132" text-anchor="middle" font-size="12" fill="#5A646D">fixed for every later session</text><rect x="278.0" y="233.0" width="196" height="58" rx="8" fill="#E9F2FC" stroke="#2E7BD4" stroke-width="1.5"/><text x="376" y="256" text-anchor="middle" font-weight="700" fill="#1A1A1A">Change ONE parameter</text><text x="376" y="276" text-anchor="middle" font-size="12" fill="#5A646D">--depth, then --exposure</text><text x="480" y="104" text-anchor="start" font-size="12" fill="#5A646D">yes</text><text x="388" y="204" text-anchor="start" font-size="12" fill="#5A646D">no</text><text x="142" y="236" text-anchor="start" font-size="12" fill="#5A646D">record again</text><text x="24" y="336" text-anchor="start" font-size="12" fill="#5A646D">Margin too large means the apparatus is too easy: lower --depth. Halving it roughly doubles the error.</text><text x="24" y="358" text-anchor="start" font-size="12" fill="#5A646D">Margin too small means it is too hard: raise --depth or --exposure, or average more pixels per channel.</text><text x="24" y="380" text-anchor="start" font-size="12" fill="#5A646D">Confirm B-3 and B-4 pass first. Dead channels bias the margin and send you to the wrong parameter.</text></svg>