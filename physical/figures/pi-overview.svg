<svg xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Liberation Serif, serif" aria-label="Top view of a Raspberry Pi 4 Model B. The 40-pin header runs along the top edge with pin 1 at the left corner. Down the left edge are the USB-C power socket, two micro-HDMI sockets and the headphone jack. The microSD card slot is on the underside at the left. The camera ribbon connector stands between the HDMI sockets and the jack. On the right edge are two USB 3 sockets in blue, two USB 2 sockets in black, and the Ethernet socket." width="1664" height="560" viewBox="0 0 1664 560">
