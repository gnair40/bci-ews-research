<svg xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Liberation Serif, serif" aria-label="Realistic board view. A Raspberry Pi 4 header at the left with three coloured jumper wires: red from pin 1 which is 3.3 volts to the sensor's VCC, yellow from pin 7 which is GPIO 4 to the sensor's DATA pin, and black from pin 9 to GND. The DHT22 sits on a small blue breakout board with a white plastic grille." width="1080" height="500" viewBox="0 0 1080 500">
