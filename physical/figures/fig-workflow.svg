<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 856" width="760" height="856" font-family="Times New Roman, Liberation Serif, serif" font-size="13"><rect width="760" height="856" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AB"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D1453B"/></marker></defs><text x="24" y="30" font-size="16" font-weight="700" fill="#1A1A1A">Two gates can halt the phase before any experimental recording</text><text x="24" y="52" font-size="12" fill="#5A646D">Stage order is enforced by the programs, not only by the documentation</text><path d="M196 124V156" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M196 216V248" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M196 308V340" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M196 400V428" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M196 544V572" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M196 636V668" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M196 724V760" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><rect x="46.0" y="60.0" width="300" height="64" rx="8" fill="#E9F2FC" stroke="#2E7BD4" stroke-width="1.5"/><text x="196" y="86" text-anchor="middle" font-weight="700" fill="#1A1A1A">0. Software verification</text><text x="196" y="106" text-anchor="middle" font-size="12" fill="#5A646D">self-test, dry run, 50 fps benchmark B-0</text><rect x="46.0" y="152.0" width="300" height="64" rx="8" fill="#FBEEE9" stroke="#E06B4F" stroke-width="1.5"/><text x="196" y="178" text-anchor="middle" font-weight="700" fill="#1A1A1A">1. Procurement</text><text x="196" y="198" text-anchor="middle" font-size="12" fill="#5A646D">four critical parts, about 110 USD</text><rect x="46.0" y="244.0" width="300" height="64" rx="8" fill="#FBEEE9" stroke="#E06B4F" stroke-width="1.5"/><text x="196" y="270" text-anchor="middle" font-weight="700" fill="#1A1A1A">2. Computer and camera</text><text x="196" y="290" text-anchor="middle" font-size="12" fill="#5A646D">card, libraries, ribbon cable, wiring</text><rect x="46.0" y="336.0" width="300" height="64" rx="8" fill="#FBEEE9" stroke="#E06B4F" stroke-width="1.5"/><text x="196" y="362" text-anchor="middle" font-weight="700" fill="#1A1A1A">3. Enclosure construction</text><text x="196" y="382" text-anchor="middle" font-size="12" fill="#5A646D">matte lining, display, camera, seal</text><polygon points="196,428 376,486 196,544 16,486" fill="#FDF4E4" stroke="#E0A030" stroke-width="2"/><text x="196" y="476" text-anchor="middle" font-weight="700" fill="#1A1A1A">4. Acceptance gate</text><text x="196" y="496" text-anchor="middle" font-size="12" fill="#5A646D">B-2 to B-7, gates G-a to G-e</text><text x="196" y="514" text-anchor="middle" font-size="12" fill="#5A646D">margin 36.1 deg within 6</text><rect x="46.0" y="572.0" width="300" height="64" rx="8" fill="#FDF4E4" stroke="#E0A030" stroke-width="1.5"/><text x="196" y="598" text-anchor="middle" font-weight="700" fill="#1A1A1A">5. Preregistration frozen</text><text x="196" y="618" text-anchor="middle" font-size="12" fill="#5A646D">completed 24 Sep 2026, commit f4dda04</text><rect x="46.0" y="664.0" width="300" height="64" rx="8" fill="#FBEEE9" stroke="#E06B4F" stroke-width="1.5"/><text x="196" y="690" text-anchor="middle" font-weight="700" fill="#1A1A1A">6. Data acquisition</text><text x="196" y="710" text-anchor="middle" font-size="12" fill="#5A646D">337 sessions, about 28 h, P-2 P-3 P-5 P-7</text><rect x="46.0" y="756.0" width="300" height="64" rx="8" fill="#E9F2FC" stroke="#2E7BD4" stroke-width="1.5"/><text x="196" y="782" text-anchor="middle" font-weight="700" fill="#1A1A1A">7. Analysis and reporting</text><text x="196" y="802" text-anchor="middle" font-size="12" fill="#5A646D">P-4, P-6, six figures, fixed criteria</text><rect x="452.0" y="60" width="268" height="64" rx="8" fill="#FBEAE8" stroke="#D1453B" stroke-width="1.5" stroke-dasharray="6 4"/><text x="586" y="86" text-anchor="middle" font-weight="700" fill="#1A1A1A">Revise before purchase</text><text x="586" y="106" text-anchor="middle" font-size="12" fill="#5A646D">if 50 fps cannot be sustained</text><rect x="452.0" y="445" width="268" height="82" rx="8" fill="#FBEAE8" stroke="#D1453B" stroke-width="1.5" stroke-dasharray="6 4"/><text x="586" y="470" text-anchor="middle" font-weight="700" fill="#1A1A1A">Halt the phase</text><text x="586" y="490" text-anchor="middle" font-size="12" fill="#5A646D">report an apparatus that could</text><text x="586" y="508" text-anchor="middle" font-size="12" fill="#5A646D">not be matched; do not proceed</text><path d="M346 92H452" fill="none" stroke="#D1453B" stroke-width="1.5" marker-end="url(#r)" stroke-dasharray="6 4"/><path d="M376 486H452" fill="none" stroke="#D1453B" stroke-width="1.5" marker-end="url(#r)" stroke-dasharray="6 4"/><text x="399" y="82" text-anchor="middle" font-size="12" fill="#5A646D">fail</text><text x="414" y="476" text-anchor="middle" font-size="12" fill="#5A646D">G-e fails</text><text x="210" y="566" text-anchor="start" font-size="12" fill="#5A646D">all five gates pass</text><text x="210" y="660" text-anchor="start" font-size="12" fill="#5A646D">no session may be recorded before this</text></svg>