<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Times New Roman, Liberation Serif, serif" font-size="13"><rect width="760" height="400" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3AB"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D1453B"/></marker></defs><text x="24" y="30" font-size="16" font-weight="700" fill="#1A1A1A">The onset is sealed before the recording exists, so the lead time has one value</text><text x="24" y="52" font-size="12" fill="#5A646D">Designed faults, experiments P-2 and P-3</text><path d="M241 136H275" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M485 136H519" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><path d="M136 168V268H624V168" fill="none" stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#a)"/><rect x="31.0" y="104.0" width="210" height="64" rx="8" fill="#EAF6EE" stroke="#2E9E54" stroke-width="1.5"/><text x="136" y="126" text-anchor="middle" font-weight="700" fill="#1A1A1A">1. draw_onset.py</text><text x="136" y="146" text-anchor="middle" font-size="12" fill="#5A646D">time, type, severity chosen</text><text x="136" y="164" text-anchor="middle" font-size="12" fill="#5A646D">sealed with SHA-256</text><rect x="275.0" y="104.0" width="210" height="64" rx="8" fill="#E9F2FC" stroke="#2E7BD4" stroke-width="1.5"/><text x="380" y="126" text-anchor="middle" font-weight="700" fill="#1A1A1A">2. run_session.py</text><text x="380" y="146" text-anchor="middle" font-size="12" fill="#5A646D">fault applied at the drawn time,</text><text x="380" y="164" text-anchor="middle" font-size="12" fill="#5A646D">in software or by hand</text><rect x="519.0" y="104.0" width="210" height="64" rx="8" fill="#E9F2FC" stroke="#2E7BD4" stroke-width="1.5"/><text x="624" y="126" text-anchor="middle" font-weight="700" fill="#1A1A1A">3. analyze_leadtime.py</text><text x="624" y="146" text-anchor="middle" font-size="12" fill="#5A646D">warning time compared</text><text x="624" y="164" text-anchor="middle" font-size="12" fill="#5A646D">against the sealed onset</text><text x="380" y="262" text-anchor="middle" font-size="12" fill="#5A646D">the sealed plan is the ground truth, and its checksum is in MANIFEST.csv</text><rect x="24" y="292" width="712" height="80" rx="8" fill="#FBEAE8" stroke="#D1453B" stroke-width="1.5" stroke-dasharray="6 4"/><text x="40" y="318" font-weight="700" fill="#1A1A1A">Refusals that enforce the order</text><text x="40" y="340" text-anchor="start" font-size="12" fill="#5A646D">run_session.py refuses a session with no drawn plan. draw_onset.py refuses to overwrite a plan.</text><text x="40" y="360" text-anchor="start" font-size="12" fill="#5A646D">note_onset.py refuses to overwrite a noted onset without --replace and a log entry.</text></svg>