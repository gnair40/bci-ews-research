<rect x="760" y="406" width="282" height="44" rx="8" fill="#FFFFFF" stroke="#D5DBDE"/><rect x="774" y="419" width="26" height="18" rx="4" fill="#8B5CD6"/><text x="812" y="435" fill="#13202C" font-weight="700">motor IN1–IN4</text>
<rect x="1058" y="406" width="282" height="44" rx="8" fill="#FFFFFF" stroke="#D5DBDE"/><rect x="1072" y="419" width="26" height="18" rx="4" fill="#E8453A"/><text x="1110" y="435" fill="#13202C" font-weight="700">motor 5 V</text>
<rect x="1356" y="406" width="268" height="44" rx="8" fill="#FFFFFF" stroke="#D5DBDE"/><rect x="1370" y="419" width="26" height="18" rx="4" fill="#E8A33D"/><text x="1408" y="435" fill="#13202C" font-weight="700">sensor DATA</text>
<rect x="760" y="462" width="282" height="44" rx="8" fill="#FFFFFF" stroke="#D5DBDE"/><rect x="774" y="475" width="26" height="18" rx="4" fill="#1B9E8F"/><text x="812" y="491" fill="#13202C" font-weight="700">sensor 3.3 V</text>
<rect x="1058" y="462" width="282" height="44" rx="8" fill="#FFFFFF" stroke="#D5DBDE"/><rect x="1072" y="475" width="26" height="18" rx="4" fill="#6E7C86"/><text x="1110" y="491" fill="#13202C" font-weight="700">ground</text>
