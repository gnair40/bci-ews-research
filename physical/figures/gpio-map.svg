<text x="40" y="492" fill="#6E8292" font-family="Times New Roman, Liberation Serif, serif" font-size="19">“GPIO 13” and “physical pin 13” are</text>
<text x="40" y="518" fill="#6E8292" font-family="Times New Roman, Liberation Serif, serif" font-size="19">different holes. Both numbers, always.</text>
