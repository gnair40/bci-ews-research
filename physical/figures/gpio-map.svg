<linearGradient id="hgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0BE"/><stop offset="0.45" stop-color="#E0B64A"/><stop offset="1" stop-color="#8F6A1C"/></linearGradient>
<filter id="hsh" x="-20%" y="-30%" width="150%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0A1A12" flood-opacity="0.35"/></filter>
</defs>
