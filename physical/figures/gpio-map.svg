<svg xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Liberation Serif, serif" aria-label="Close-up of the 40-pin header on its green board, drawn as two rows of gold pins in a black plastic block. Odd pins 1 to 39 run along the top row, even pins 2 to 40 along the bottom. Seven pins are ringed and labelled: pin 1 is 3.3 volts for the sensor, pin 2 is 5 volts for the motor, pin 7 is GPIO 4 for the sensor data line, pin 9 is ground, and pins 11, 13, 15 and 16 are GPIO 17, 27, 22 and 23 for the motor's four control lines." width="1664" height="540" viewBox="0 0 1664 540">
